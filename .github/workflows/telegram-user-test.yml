name: Telegram account premium emoji test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesterdossier-newsroom
  cancel-in-progress: false
jobs:
  saved-messages-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r newsroom_private/requirements-user.txt
      - name: Test only in owner Saved Messages
        run: python3 -m newsroom_private.telegram_user.transport
