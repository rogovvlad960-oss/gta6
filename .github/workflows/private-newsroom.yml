name: Lester private post monitor
on:
  schedule:
    - cron: '*/15 5-21 * * *' # 08:00-00:45 Moscow; quiet 01:00-08:00
  push:
    branches: [main]
    paths: ['newsroom_private/**', '.github/workflows/private-newsroom.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [cycle, probe]
        default: cycle
      cloudflare_tick:
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: lesterdossier-newsroom
  cancel-in-progress: false
jobs:
  private-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NEWSROOM_LLM_KEY: ${{ secrets.NEWSROOM_LLM_KEY }}
      NEWSROOM_AI_SPEND_APPROVED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
      MONITOR_MODE: ${{ inputs.mode || 'cycle' }}
      PRIVATE_CLOCK_TICK: ${{ inputs.cloudflare_tick || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: python3 -m pip install --disable-pip-version-check -r newsroom_private/requirements.txt
      - name: Private destination, duplicate and rate-limit tests
        run: python3 -m unittest newsroom_private.test_monitor newsroom_private.test_post_format newsroom_private.test_post_rules newsroom_private.test_queue_repair newsroom_private.test_delivery_reliability -v
      - name: Private editor
        run: python3 -m newsroom_private.monitor "$MONITOR_MODE"
